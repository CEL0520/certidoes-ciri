<!doctype html>
<html lang="pt-BR">
<head>

  .corpo { padding: 14px; font-size: 13px; }
  button { width: 100%; margin-top: 10px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; padding: 9px; background: #1f3a5f; color: #fff; cursor: pointer; }
</style>

<body>
<div class="cab">Certidões CIRI</div>
<div class="corpo">
  Com a conversa aberta nesta aba, clique em <b>Ler esta conversa</b>. No WhatsApp Web, o aviso que aparece também oferece <b>Gerar PDF do print</b>.
  <button id="ler" style="background:#b8860b">Ler esta conversa</button>
  <button id="abrir">Abrir o gerador</button>
  <p id="erro" style="color:#a12;margin:8px 0 0"></p>
</div>
<script src="popup.js"></script>

</html>
